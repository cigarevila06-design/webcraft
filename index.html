<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEBCRAFT — создание сайтов под ключ</title>
<meta name="description" content="WEBCRAFT — создание современных сайтов для бизнеса. Сайт-визитка, лендинг, многостраничный сайт и интернет-магазин.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#090a0d">
<link rel="canonical" href="https://cigarevila06-design.github.io/webcraft/">

<meta property="og:title" content="WEBCRAFT — создание сайтов">
<meta property="og:description" content="Современные сайты для бизнеса от 1 000 ₽">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cigarevila06-design.github.io/webcraft/">

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
    --bg:#090a0d;
    --panel:#111319;
    --panel2:#171a22;
    --orange:#ff8528;
    --orange2:#ffad58;
    --white:#f7f7f8;
    --muted:#9295a0;
    --border:rgba(255,255,255,.09);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Manrope',Arial,sans-serif;
    background:
        radial-gradient(circle at 80% 10%,rgba(255,133,40,.10),transparent 28%),
        radial-gradient(circle at 10% 40%,rgba(255,133,40,.05),transparent 25%),
        var(--bg);
    color:var(--white);
    line-height:1.6;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(1180px,calc(100% - 40px));
    margin:auto;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(9,10,13,.78);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

.nav{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    font-size:23px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    color:var(--orange);
}

.nav-links{
    display:flex;
    gap:28px;
    color:#b9bbc3;
    font-size:14px;
    font-weight:600;
}

.nav-links a{
    transition:.2s;
}

.nav-links a:hover{
    color:var(--white);
}

.nav-btn{
    padding:11px 18px;
    border-radius:12px;
    background:var(--orange);
    color:#111;
    font-weight:800;
    font-size:14px;
    transition:.2s;
}

.nav-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(255,133,40,.2);
}

/* HERO */

.hero{
    padding:95px 0 70px;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:70px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border:1px solid rgba(255,133,40,.25);
    background:rgba(255,133,40,.07);
    color:var(--orange2);
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    margin-bottom:22px;
}

.badge-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--orange);
    box-shadow:0 0 12px var(--orange);
}

h1{
    font-size:clamp(45px,6vw,78px);
    line-height:1.02;
    letter-spacing:-4px;
    max-width:760px;
}

h1 span{
    color:var(--orange);
}

.hero-text{
    margin-top:25px;
    max-width:600px;
    color:var(--muted);
    font-size:18px;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:13px;
    margin-top:32px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    padding:0 22px;
    border-radius:13px;
    font-weight:800;
    transition:.2s;
}

.btn-primary{
    background:var(--orange);
    color:#111;
}

.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 35px rgba(255,133,40,.22);
}

.btn-secondary{
    border:1px solid var(--border);
    background:rgba(255,255,255,.035);
    color:var(--white);
}

.btn-secondary:hover{
    background:rgba(255,255,255,.07);
}

/* HERO MOCKUP */

.hero-visual{
    position:relative;
}

.browser{
    background:#0e1015;
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    transform:rotate(1deg);
}

.browser-top{
    height:43px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:0 15px;
    border-bottom:1px solid var(--border);
}

.browser-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
}

.browser-content{
    padding:24px;
    min-height:390px;
    background:
        linear-gradient(135deg,rgba(255,133,40,.12),transparent 45%),
        #111319;
}

.mock-nav{
    height:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.mock-logo{
    width:70px;
    height:9px;
    background:var(--orange);
    border-radius:5px;
}

.mock-links{
    display:flex;
    gap:8px;
}

.mock-links i{
    width:30px;
    height:6px;
    border-radius:4px;
    background:#343741;
}

.mock-main{
    margin-top:60px;
    display:grid;
    grid-template-columns:1fr .75fr;
    gap:20px;
    align-items:center;
}

.mock-title{
    width:90%;
    height:20px;
    border-radius:8px;
    background:#f2f2f2;
    box-shadow:0 27px 0 #f2f2f2;
}

.mock-small{
    width:80%;
    height:8px;
    border-radius:5px;
    background:#474a54;
    margin-top:48px;
}

.mock-card{
    height:180px;
    border-radius:18px;
    background:
        linear-gradient(145deg,#ff8528,#7c3109);
    position:relative;
    overflow:hidden;
}

.mock-card:after{
    content:"";
    position:absolute;
    width:160px;
    height:160px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    right:-50px;
    bottom:-50px;
}

.mock-button{
    margin-top:25px;
    width:105px;
    height:28px;
    border-radius:8px;
    background:var(--orange);
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
}

.stat{
    padding:25px;
    text-align:center;
    border-right:1px solid var(--border);
}

.stat:last-child{
    border-right:0;
}

.stat strong{
    display:block;
    font-size:28px;
}

.stat span{
    color:var(--muted);
    font-size:13px;
}

/* SECTIONS */

section{
    padding:100px 0;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:30px;
    margin-bottom:40px;
}

.section-label{
    color:var(--orange);
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:10px;
}

h2{
    font-size:clamp(34px,4vw,53px);
    line-height:1.05;
    letter-spacing:-2px;
}

.section-desc{
    max-width:470px;
    color:var(--muted);
}

/* SERVICES */

.services{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.service{
    position:relative;
    padding:30px;
    min-height:235px;
    background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    transition:.25s;
}

.service:hover{
    transform:translateY(-5px);
    border-color:rgba(255,133,40,.35);
}

.service-number{
    color:rgba(255,255,255,.18);
    font-size:42px;
    font-weight:800;
}

.service h3{
    font-size:23px;
    margin-top:15px;
}

.service p{
    color:var(--muted);
    font-size:14px;
    max-width:480px;
    margin-top:8px;
}

.price{
    position:absolute;
    right:25px;
    bottom:25px;
    color:var(--orange2);
    font-size:19px;
    font-weight:800;
}

/* PORTFOLIO */

.portfolio{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.project{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    transition:.25s;
}

.project:hover{
    transform:translateY(-6px);
    border-color:rgba(255,133,40,.35);
}

.project-preview{
    height:220px;
    padding:14px;
    background:#0b0c10;
}

.project-browser{
    height:100%;
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    background:#16181e;
}

.project-bar{
    height:25px;
    background:#0f1014;
    display:flex;
    align-items:center;
    gap:4px;
    padding-left:9px;
}

.project-bar i{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#555;
}

.project-page{
    padding:17px;
    height:calc(100% - 25px);
}

.barber .project-page{
    background:linear-gradient(145deg,#151515,#242424);
}

.bike .project-page{
    background:linear-gradient(145deg,#101820,#162b35);
}

.tech .project-page{
    background
